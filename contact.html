<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <h1> Registration Form </h1>
    <form>
       <label for="Full Name">Full Name :</label>
       <input type="text" placeholder="enter full Name" required>
       <br><br>
       <label for="emailId">Email Id :</label>
       <input type="email" placeholder="enter emailId">
       <br><br>
       <label for="date">DOB :</label>
       <input type="date" placeholder="enter date">
       <br><br>
       <label for="date">Password : </label>
       <input type="password" placeholder="enter Password">
       <br><br>
       <label for="color">Color :</label>
       <input type="color">
       <br><br>
       <label for="number">Phone Number :</label>
       <input type="number" placeholder="enter number">
       <br><br>
       <label for="age">Age :</label>
       <input type="number" min="18" max="60" placeholder="age">
       <br><br>
       <label for="course">Course :</label>
       <select option="course" >
        <option value="java">java</option>
        <option value="react">react</option>
        <option value="testing">testing</option>
       </select>
       <br><br>
       <label for="gender">Gender :</label>
       <input type="radio" value="Male">Male
       <input type="radio" value="Female">Female
       <input type="radio" value="other">others
       <br><br>
       <label>Send Notification :</label>
       <input type="checkbox">yes
       <br><br>
       <label for="comments">Comments :</label>
       <br>
       <textarea id="comments"  rows="5" cols="40px"></textarea>
<br><br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
<br><br>
<a href="professional.html">Home</a>


    </form>
</body>
</html>
